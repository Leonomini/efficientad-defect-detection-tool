general:
  name: teacher_pretraining
  seed: 42
  device: auto              # auto | cuda | cpu

paths:
  imagenet_train: datasets/imagenet/val.X
  output_dir: pretrained

model:
  size: small    # small | medium
  out_channels: 384

training:
  steps: 60000
  normalization_steps: 10000
  batch_size: 16
  num_workers: 7
  learning_rate: 1e-4
  weight_decay: 1e-5
  log_interval: 10
  check_interval: 10000

data:
  input_shape: [3, 512, 512]
  layers_to_extract_from:
    - layer2
    - layer3
